name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Build Mobile Web Bundle
        run: node mobile/build.mjs

      - name: Run Mobile Bridge Smoke & Regression Tests
        run: node --test test/mobile-bridge-startup.test.js

      - name: Run Full Deterministic Unit Test Suite
        run: npm test

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify and Inspect Built APKs
        run: |
          count=$(find android/app/build/outputs/apk -name "*.apk" | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::No APK files found under android/app/build/outputs/apk"
            exit 1
          fi
          echo "Found $count APK files:"
          find android/app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;
          echo "SHA-256 Checksums:"
          find android/app/build/outputs/apk -name "*.apk" -exec sha256sum {} \;

      - name: Upload Android Debug APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-android-debug-apks
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
