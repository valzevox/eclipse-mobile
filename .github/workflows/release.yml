name: Mobile Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript Check
        run: npm run typecheck

      - name: Generate Android Native Project
        run: npx expo prebuild --platform android --clean

      - name: Build Android Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p build-artifacts
          TAG_VER="${GITHUB_REF_NAME}"
          if [ -z "$TAG_VER" ] || [ "$TAG_VER" = "main" ]; then
            TAG_VER="v1.0.0"
          fi
          cp android/app/build/outputs/apk/release/*-unsigned.apk build-artifacts/eclipse-mobile-${TAG_VER}.apk || cp android/app/build/outputs/apk/release/*.apk build-artifacts/eclipse-mobile-${TAG_VER}.apk
          ls -la build-artifacts/

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: build-artifacts/*.apk
          generate_release_notes: true
