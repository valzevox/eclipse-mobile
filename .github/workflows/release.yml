name: Mobile Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript Check
        run: npm run typecheck

      - name: Generate Android Native Project
        run: |
          npx expo prebuild --platform android --clean
          node scripts/patch-android-build.js
          echo "android.kotlinVersion=1.9.25" >> android/gradle.properties

      - name: Build Android Release APK
        working-directory: android
        run: ./gradlew assembleRelease -Pandroid.kotlinVersion=1.9.25 --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p build-artifacts
          TAG_VER="${GITHUB_REF_NAME}"
          if [ -z "$TAG_VER" ] || [ "$TAG_VER" = "main" ]; then
            TAG_VER="v1.0.0"
          fi
          APK_SRC=$(find android/app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_SRC"
          cp "$APK_SRC" "build-artifacts/Eclipse-${TAG_VER}.apk"
          ls -la build-artifacts/

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: build-artifacts/*.apk
          generate_release_notes: true

      - name: Auto-generate detailed changelog if notes are empty
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "${PREV_TAG}..${TAG}" --pretty=format:"* %s (%h)")
          else
            COMMITS=$(git log -n 10 --pretty=format:"* %s (%h)")
          fi
          NOTES="### ✨ What's New in ${TAG}

${COMMITS}

**Full Diff**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
          gh release edit "${TAG}" --repo "${{ github.repository }}" --title "${TAG}" --notes "${NOTES}"
