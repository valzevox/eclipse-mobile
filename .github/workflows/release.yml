name: Mobile Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript Verification
        run: npm run typecheck

      - name: Export Mobile Bundle (Android & iOS)
        run: npx expo export --output-dir dist-mobile

      - name: Package Release Archive
        run: |
          zip -r eclipse-mobile-${GITHUB_REF_NAME}.zip dist-mobile app.json package.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: eclipse-mobile-${{ github.ref_name }}.zip
          generate_release_notes: true
