name: Mobile Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-release
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Stamp Build Info & Build Web Bundle
        run: |
          node mobile/build.mjs
          node tools/build-info.mjs www/build-info.js android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Release APK
        env:
          ECLIPSE_VERSION_CODE: ${{ github.run_number }}
        run: |
          export ECLIPSE_VERSION_NAME="$(node -p "require('./package.json').version")"
          export ECLIPSE_KEYSTORE="$(pwd)/android/eclipse-release.jks"
          export ECLIPSE_KEYSTORE_PASSWORD="eclipse123"
          export ECLIPSE_KEY_PASSWORD="eclipse123"
          export ECLIPSE_KEY_ALIAS="eclipse"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p build-artifacts
          TAG_VER="${GITHUB_REF_NAME}"
          if [ -z "$TAG_VER" ] || [ "$TAG_VER" = "main" ]; then
            TAG_VER="v$(node -p "require('./package.json').version")"
          fi
          APK_SRC=$(find android/app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_SRC"
          cp "$APK_SRC" "build-artifacts/Eclipse-${TAG_VER}.apk"
          ls -la build-artifacts/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eclipse-apk
          path: build-artifacts/*.apk

  build-ipa:
    runs-on: macos-15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: Stamp Build Info & Build Web Bundle
        run: |
          node mobile/build.mjs
          node tools/build-info.mjs www/build-info.js ios

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Compile iOS (unsigned)
        run: |
          xcodebuild -quiet \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$(node -p "require('./package.json').version")" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build

      - name: Package Eclipse.ipa
        run: |
          mkdir -p Payload build-artifacts
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          TAG_VER="${GITHUB_REF_NAME}"
          if [ -z "$TAG_VER" ] || [ "$TAG_VER" = "main" ]; then
            TAG_VER="v$(node -p "require('./package.json').version")"
          fi
          zip -qry "build-artifacts/Eclipse-${TAG_VER}.ipa" Payload
          ls -lh build-artifacts/

      - name: Write SideStore / AltStore source
        env:
          RUN: ${{ github.run_number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: node .github/sidestore-source.js

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eclipse-ipa
          path: build-artifacts/*

  publish-release:
    needs: [build-apk, build-ipa]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepare Assets & Release Notes
        id: release_notes
        run: |
          ls -la release-assets/
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          echo "Previous tag: $PREV_TAG"
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log "$PREV_TAG..HEAD" --pretty=format:"* %s" --reverse)
          else
            NOTES=$(git log -n 10 --pretty=format:"* %s" --reverse)
          fi
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.NOTES }}
          files: release-assets/*
